<header class="top-header">
  <h1>Demander un rendez-vous</h1>
</header>

<div class="page-content">
  <div class="form-container">
    <div class="form-section">
      <h2>Informations du rendez-vous</h2>
      
      <div class="form-group">
        <label>Type de consultation</label>
        <select class="form-control">
          <option>Consultation générale</option>
          <option>Suivi médical</option>
          <option>Urgence</option>
          <option>Spécialiste</option>
        </select>
      </div>

      <div class="form-group">
        <label>Spécialité médicale</label>
        <select class="form-control">
          <option>Médecine générale</option>
          <option>Cardiologie</option>
          <option>Dermatologie</option>
          <option>Pédiatrie</option>
          <option>Gynécologie</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date souhaitée</label>
          <input type="date" class="form-control">
        </div>
        <div class="form-group">
          <label>Heure préférée</label>
          <select class="form-control">
            <option>Matin (8h-12h)</option>
            <option>Après-midi (14h-18h)</option>
            <option>Pas de préférence</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Médecin souhaité (optionnel)</label>
        <select class="form-control">
          <option>Pas de préférence</option>
          <option>Dr. Martin Leblanc</option>
          <option>Dr. Sophie Martin</option>
          <option>Dr. Claire Dubois</option>
        </select>
      </div>

      <div class="form-group">
        <label>Motif de consultation</label>
        <textarea class="form-control" rows="4" placeholder="Décrivez brièvement le motif de votre consultation..."></textarea>
      </div>

      <div class="form-group">
        <label>Urgence</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="urgence" value="normale">
            <span>Consultation normale</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="urgence" value="urgente">
            <span>Consultation urgente</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-secondary">Annuler</button>
        <button class="btn-primary">Envoyer la demande</button>
      </div>
    </div>

    <div class="info-panel">
      <div class="info-card">
        <h3>📋 Informations importantes</h3>
        <ul>
          <li>Les demandes sont traitées sous 24h</li>
          <li>Vous recevrez une confirmation par email</li>
          <li>En cas d'urgence, appelez le 15</li>
        </ul>
      </div>
      
      <div class="info-card">
        <h3>🕐 Horaires d'ouverture</h3>
        <p><strong>Lundi - Vendredi:</strong> 8h00 - 18h00</p>
        <p><strong>Samedi:</strong> 9h00 - 12h00</p>
        <p><strong>Dimanche:</strong> Fermé</p>
      </div>
    </div>
  </div>
</div>
